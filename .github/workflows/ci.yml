name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify plugin
        run: sh ./gradlew test buildPlugin verifyPluginStructure verifyPlugin --stacktrace
      - name: Upload plugin test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-diagnostics
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/pluginVerifier/
            .intellijPlatform/sandbox/**/log/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossemmet-plugin
          path: build/distributions/CrossEmmet-*.zip
          if-no-files-found: error
          retention-days: 30
